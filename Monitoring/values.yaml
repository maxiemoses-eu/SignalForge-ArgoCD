# --- PART 1: KUBE-PROMETHEUS-STACK (Metrics, Alerts, & UI) ---
kube-prometheus-stack:
  # 1.1 Alertmanager Configuration
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'job']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'slack-notifications'
      receivers:
      - name: 'slack-notifications'
        slack_configs:
        - api_url: 'https://hooks.slack.com/services/T000/B000/XXXX' # Replace with your real webhook
          channel: '#monitoring-alerts'
          send_resolved: true

  # 1.2 Grafana Configuration
  grafana:
    enabled: true
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: "admin-user"
      passwordKey: "admin-password"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL # Correct: Scans all namespaces for your JSON files

  # 1.3 Prometheus Configuration
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false 
      retention: 10d
      storageSpec:
        volumeClaimTemplate:
          spec:
            # CHANGE: Updated from 'standard' to 'default' (Azure's standard storage class)
            storageClassName: "default" 
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

# --- PART 2: LOKI-STACK (Logs) ---
loki-stack:
  loki:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
      # CHANGE: Updated to 'default' to match Azure storage
      storageClassName: "default" 
  promtail:
    enabled: true