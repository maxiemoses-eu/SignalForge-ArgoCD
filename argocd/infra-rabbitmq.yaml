apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-rabbitmq
  namespace: argocd
spec:
  project: default
  source:
    chart: rabbitmq
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 12.x.x
    helm:
      parameters:
        - name: fullnameOverride
          value: "rabbitmq-service"
        - name: auth.username
          value: "user"
        - name: auth.password
          value: "RabbitPassword123"
        - name: replicaCount
          value: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: signalforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true