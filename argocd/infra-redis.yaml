apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-redis
  namespace: argocd
spec:
  project: default
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 18.x.x
    helm:
      parameters:
        - name: fullnameOverride
          value: "redis-service"
        - name: architecture
          value: "standalone" # Simple for now; use "replication" for prod
        - name: auth.enabled
          value: "false"      # Easier for internal testing; enable in prod
  destination:
    server: https://kubernetes.default.svc
    namespace: signalforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true