service:
  name: payment
  port: 5003

image:
  repository: signal-prod-payment-microservice
  tag: v1.1.0,latest
  pullPolicy: IfNotPresent

command: ["./payment"]

health:
  readinessPath: /health
  livenessPath: /health

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
